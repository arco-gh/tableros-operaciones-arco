# Proxy inverso para Nginx. Copiar a /etc/nginx/sites-available/arco-dashboard
# y enlazar en sites-enabled.
#
# Streamlit usa WebSockets: sin las cabeceras Upgrade/Connection el tablero
# carga pero se queda "Connecting..." y no responde a los filtros.

server {
    listen 80;
    server_name tablero.arco.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tablero.arco.mx;

    ssl_certificate     /etc/ssl/arco/tablero.crt;
    ssl_certificate_key /etc/ssl/arco/tablero.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # El tablero contiene información financiera: no debe indexarse ni cachearse.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Indispensable para el canal WebSocket de Streamlit.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Las lecturas de Excel del primer arranque pueden tardar.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}

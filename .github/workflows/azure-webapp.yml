name: Desplegar tablero en Azure App Service

# Se despliega al integrar a main, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez. Varios commits seguidos generarían ejecuciones
# simultáneas que chocan al subir el paquete: App Service devuelve
# "Conflict (CODE: 409)". Con esto, las intermedias se cancelan y sólo se
# despliega la última, que es la que interesa.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: true

# Necesario para la autenticación federada (OIDC) con Azure.
# Sin credenciales almacenadas: no hay contraseña que se pueda filtrar.
permissions:
  id-token: write
  contents: read

env:
  # Nombre del recurso App Service en Azure.
  APP_NAME: arco-tablero-operaciones

  # AJUSTE OBLIGATORIO: dominio predeterminado del App Service.
  # NO es siempre <APP_NAME>.azurewebsites.net. Desde 2024 Azure agrega un
  # sufijo aleatorio para evitar que el subdominio quede reclamable si la
  # aplicación se elimina. Cópielo tal cual de:
  #   Portal > App Service > Información general > Dominio predeterminado
  APP_HOST: arco-tablero-operaciones-effcbmfeaefrf5ds.southcentralus-01.azurewebsites.net

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # Sólo se empaqueta el código fuente. Las dependencias las instala Azure
      # en el servidor gracias a SCM_DO_BUILD_DURING_DEPLOYMENT=true, de modo
      # que se compilan contra el mismo Python que las va a ejecutar.
      #
      # Los Excel nunca viajan aquí: contienen estados de resultados por plaza
      # y el detalle de deudores con nombre y saldo.
      - name: Empaquetar el proyecto
        run: |
          zip -r tablero.zip . \
            -x "data/*" \
               ".venv/*" \
               ".git/*" \
               ".github/*" \
               "*.pyc" \
               "__pycache__/*" \
               "tablero.zip"

      # Los nombres de los secretos son los que generó Azure al configurar el
      # Centro de implementación. Llevan un sufijo aleatorio y distinto en cada
      # uno; se consultan en Settings > Secrets and variables > Actions.
      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_06CBCDE4C93C4D09B494010768DE326E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56D0C83BE2EC459CA0275733F42C5AE2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F558664321A245DEBAEA445DB95A0AB0 }}

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: tablero.zip

      # Comprobación posterior: si el tablero no levanta, el flujo falla y
      # queda constancia, en lugar de dar el despliegue por bueno.
      - name: Verificar que el tablero responde
        run: |
          sleep 60
          for intento in 1 2 3 4 5; do
            if curl -fsS "https://${APP_HOST}/_stcore/health"; then
              echo "El tablero responde correctamente."
              exit 0
            fi
            echo "Intento $intento sin respuesta; reintentando en 30 s..."
            sleep 30
          done
          echo "El tablero no respondió tras el despliegue."
          echo "Si el error es 'Could not resolve host', revise APP_HOST:"
          echo "debe ser el dominio predeterminado real que muestra el portal."
          exit 1
